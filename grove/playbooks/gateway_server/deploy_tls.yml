---
# Push the fleet wildcard onto one provisioned Gateway or Ingress Server (grove.tls, after an
# issuance or renewal). extra-vars: fleet_tls_cert, fleet_tls_key.
- name: Install the fleet certificate on a Gateway or Ingress Server
  hosts: all
  become: true
  gather_facts: false

  roles:
    - fleet_tls

  tasks:
    - name: Point pathway at the certificate
      when: fleet_tls_cert | length > 0 and fleet_tls_key | length > 0
      block:
        - name: read agent.env
          ansible.builtin.stat:
            path: /etc/pathway/agent.env
          register: agent_env

        - name: agent.env names the certificate
          when: agent_env.stat.exists
          ansible.builtin.lineinfile:
            path: /etc/pathway/agent.env
            regexp: "^{{ item.key }}="
            line: "{{ item.key }}={{ item.value }}"
          loop:
            - { key: GROVE_TLS_CERT, value: "{{ fleet_tls_cert_path }}" }
            - { key: GROVE_TLS_KEY, value: "{{ fleet_tls_key_path }}" }
          notify: restart pathway

  handlers:
    - name: restart pathway
      ansible.builtin.systemd:
        name: pathway
        state: restarted
