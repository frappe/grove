---
# Ship a new binary and the tunables to a provisioned Gateway Server. extra-vars: agent_version,
# admin_token, gateway_id, gateway_region, gateway_geography, gateway_host, proxy_hostname,
# redis_addr, redis_password, plus whatever config.json.j2 reads.
- hosts: all
  become: true
  gather_facts: true
  vars:
    grove_dir: "{{ playbook_dir }}"

  pre_tasks:
    - name: read the installed unit
      ansible.builtin.command: grep -q '^RuntimeDirectory=pathway' /etc/systemd/system/pathway.service
      register: unit_cutover
      changed_when: false
      failed_when: false

    - name: refuse to deploy onto a unit that predates the non-root cutover
      ansible.builtin.assert:
        that: unit_cutover.rc == 0
        fail_msg: >-
          pathway here still runs as root with its pid file in /run — run Setup on the Gateway
          Server first, which ships the unit this play assumes.

  # fleet_tls supplies the paths agent.env names; it writes nothing it is not handed.
  roles:
    - fleet_tls
    - install_gateway_agent

  tasks:
    - name: refuse to write agent.env without an admin token
      ansible.builtin.assert:
        that: admin_token | default('') | trim | length > 0
        fail_msg: >-
          No admin_token was passed — writing agent.env now would stop the gateway from starting at
          all, and every sync with it. Re-run from the Gateway Server's Deploy Agent button, or
          pass the same extra-vars it does.

    - name: refuse to write agent.env without the box's own identity
      ansible.builtin.assert:
        that:
          - gateway_id | default('') | trim | length > 0
          - proxy_hostname | default('') | trim | length > 0
        fail_msg: >-
          gateway_id and proxy_hostname are required — without them this box would lose the name its
          admin plane answers on. Re-run from the Deploy Agent button.

    - name: agent.env
      ansible.builtin.copy:
        dest: /etc/pathway/agent.env
        owner: frappe
        group: frappe
        content: |
          GROVE_ADMIN_TOKEN={{ admin_token }}
          GROVE_GATEWAY_ID={{ gateway_id }}
          GROVE_GATEWAY_REGION={{ gateway_region | default('') }}
          GROVE_GATEWAY_GEOGRAPHY={{ gateway_geography | default('') }}
          GROVE_REDIS_ADDR={{ redis_addr }}
          GROVE_REDIS_PASSWORD={{ redis_password }}
          GROVE_LISTEN_HTTP=:80
          GROVE_LISTEN_HTTPS=:443
          GROVE_PUBLIC_HOST={{ gateway_host | default('') }}
          GROVE_SELF_HOST={{ proxy_hostname }}
          GROVE_TLS_CERT={{ fleet_tls_cert_path if (fleet_tls_cert | default('')) else '' }}
          GROVE_TLS_KEY={{ fleet_tls_key_path if (fleet_tls_cert | default('')) else '' }}
          GROVE_ACCESS_LOG=/var/log/pathway/access.log
          GROVE_ERROR_LOG=/var/log/pathway/error.log
          GROVE_PAYLOAD_LOG=/var/log/pathway/payload.log
          GROVE_CONFIG=/etc/pathway/config.json
          GROVE_PID_FILE=/run/pathway/pathway.pid
        mode: "0600"
      no_log: true
      notify: restart pathway

    - name: config.json
      ansible.builtin.template:
        src: "{{ grove_dir }}/config.json.j2"
        dest: /etc/pathway/config.json
        mode: "0644"
      notify: reload pathway config

    # copy renames into place: a running executable cannot be truncated (text file busy), and the
    # SIGHUP re-execs whatever the path then resolves to.
    - name: install pathway binary
      ansible.builtin.copy:
        src: /tmp/pathway
        dest: /usr/local/bin/pathway
        mode: "0755"
        remote_src: true
      notify: upgrade pathway

  handlers:
    - name: upgrade pathway
      ansible.builtin.command: systemctl reload-or-restart pathway
      changed_when: true

    - name: reload pathway config
      ansible.builtin.command: systemctl kill -s SIGUSR1 pathway
      changed_when: true
      failed_when: false

    - name: restart pathway
      ansible.builtin.systemd:
        name: pathway
        state: restarted
        daemon_reload: true
