---
# Provision a Gateway Server: pathway on its Network's Gateway Store. extra-vars: admin_token,
# agent_version, gateway_id, gateway_region, gateway_geography, gateway_host, proxy_hostname,
# redis_addr, redis_password, the fleet TLS pair, and the tunables in config.json.j2.
- hosts: all
  become: true
  gather_facts: true
  vars:
    grove_dir: "{{ playbook_dir }}"

  pre_tasks:
    - name: refuse to provision without an admin token
      ansible.builtin.assert:
        that: admin_token | default('') | trim | length > 0
        fail_msg: >-
          No admin_token was passed — provision from the Gateway Server's Setup button, or pass the
          same extra-vars it does.

  roles:
    - grove_user
    - remove_cloud_user
    - auditd
    - fleet_tls
    - install_gateway_agent
    - pathway_memory

  tasks:
    - name: stop and disable openresty
      ansible.builtin.systemd:
        name: openresty
        state: stopped
        enabled: false
      failed_when: false

    - name: retire the old grove-gateway unit (agent renamed to pathway)
      ansible.builtin.systemd:
        name: grove-gateway
        state: stopped
        enabled: false
      failed_when: false

    - name: remove the old grove-gateway files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/grove-gateway.service
        - /etc/logrotate.d/grove-gateway
        - /usr/local/bin/grove-gateway
        - /etc/grove-gateway

    - name: forget the removed unit
      ansible.builtin.systemd:
        daemon_reload: true

    - name: pathway config directory
      ansible.builtin.file:
        path: /etc/pathway
        state: directory
        mode: "0755"

    - name: pathway log directory
      ansible.builtin.file:
        path: /var/log/pathway
        state: directory
        owner: "{{ grove_user }}"
        group: "{{ grove_user }}"
        mode: "0755"

    # Ownership only: `file: recurse` would stamp the directory's mode onto payload.log.
    - name: hand the existing logs to the process
      ansible.builtin.command: "chown -Rc {{ grove_user }}:{{ grove_user }} /var/log/pathway"
      register: pathway_log_chown
      changed_when: pathway_log_chown.stdout | length > 0

    - name: keep the logs private
      ansible.builtin.command: "find /var/log/pathway -type f ! -perm 0640 -exec chmod -c 0640 {} +"
      register: pathway_log_mode
      changed_when: pathway_log_mode.stdout | length > 0

    - name: access log rotation
      ansible.builtin.copy:
        src: "{{ grove_dir }}/logrotate/pathway"
        dest: /etc/logrotate.d/pathway
        mode: "0644"

    - name: gateway binary
      ansible.builtin.copy:
        src: /tmp/pathway
        dest: /usr/local/bin/pathway
        mode: "0755"
        remote_src: true
      notify: restart pathway

    - name: agent.env
      ansible.builtin.copy:
        dest: /etc/pathway/agent.env
        owner: frappe
        group: frappe
        content: |
          GROVE_ADMIN_TOKEN={{ admin_token }}
          GROVE_GATEWAY_ID={{ gateway_id | default('') }}
          GROVE_GATEWAY_REGION={{ gateway_region | default('') }}
          GROVE_GATEWAY_GEOGRAPHY={{ gateway_geography | default('') }}
          GROVE_REDIS_ADDR={{ redis_addr }}
          GROVE_REDIS_PASSWORD={{ redis_password }}
          GROVE_LISTEN_HTTP=:80
          GROVE_LISTEN_HTTPS=:443
          GROVE_PUBLIC_HOST={{ gateway_host | default('') }}
          GROVE_SELF_HOST={{ proxy_hostname | default('') }}
          GROVE_TLS_CERT={{ fleet_tls_cert_path if (fleet_tls_cert | default('')) else '' }}
          GROVE_TLS_KEY={{ fleet_tls_key_path if (fleet_tls_cert | default('')) else '' }}
          GROVE_ACCESS_LOG=/var/log/pathway/access.log
          GROVE_ERROR_LOG=/var/log/pathway/error.log
          GROVE_PAYLOAD_LOG=/var/log/pathway/payload.log
          GROVE_CONFIG=/etc/pathway/config.json
          GROVE_PID_FILE=/run/pathway/pathway.pid
        mode: "0600"
      no_log: true
      notify: restart pathway

    - name: config.json
      ansible.builtin.template:
        src: "{{ grove_dir }}/config.json.j2"
        dest: /etc/pathway/config.json
        mode: "0644"
      notify: reload pathway config

    - name: systemd unit
      ansible.builtin.copy:
        src: "{{ grove_dir }}/systemd/pathway.service"
        dest: /etc/systemd/system/pathway.service
        mode: "0644"
      notify:
        - reload systemd
        - restart pathway

    - name: pathway started
      ansible.builtin.systemd:
        name: pathway
        enabled: true
        state: started
        daemon_reload: true

    # Before the local redis below stops: pathway must already be on the store.
    - name: restart onto the new agent.env
      ansible.builtin.meta: flush_handlers

    - name: stop the redis a gateway once ran itself
      ansible.builtin.systemd:
        name: redis-server
        state: stopped
        enabled: false
      failed_when: false

  handlers:
    - name: reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: restart pathway
      ansible.builtin.systemd:
        name: pathway
        state: restarted
        daemon_reload: true

    - name: reload pathway config
      ansible.builtin.command: systemctl kill -s SIGUSR1 pathway
      changed_when: true
      failed_when: false
