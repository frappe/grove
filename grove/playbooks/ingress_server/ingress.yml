---
# Provision an Ingress Server: local Redis + pathway in ingress mode. extra-vars: admin_token,
# data_token, agent_version, ingress_id, ingress_hostname, the fleet TLS pair.
- hosts: all
  become: true
  gather_facts: true
  vars:
    grove_dir: "{{ playbook_dir }}"
    ingress_hostname: ""

  pre_tasks:
    - name: refuse to provision without an admin token
      ansible.builtin.assert:
        that: admin_token | default('') | trim | length > 0
        fail_msg: >-
          No admin_token was passed — provision from the Ingress Server's Provision button, or
          pass the same extra-vars it does.

    - name: refuse to provision without a data token
      ansible.builtin.assert:
        that: data_token | default('') | trim | length > 0
        fail_msg: >-
          No data_token was passed — an ingress without one refuses every gateway. Provision from
          the Ingress Server's button, or pass the same extra-vars it does.

  roles:
    - grove_user
    - remove_cloud_user
    - auditd
    - fleet_tls
    - install_gateway_agent
    - pathway_memory

  tasks:
    - name: stop and disable openresty
      ansible.builtin.systemd:
        name: openresty
        state: stopped
        enabled: false
      failed_when: false

    - name: retire the old grove-gateway unit (agent renamed to pathway)
      ansible.builtin.systemd:
        name: grove-gateway
        state: stopped
        enabled: false
      failed_when: false

    - name: remove the old grove-gateway files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/grove-gateway.service
        - /etc/logrotate.d/grove-gateway
        - /usr/local/bin/grove-gateway
        - /etc/grove-gateway

    - name: forget the removed unit
      ansible.builtin.systemd:
        daemon_reload: true

    - name: install redis-server
      ansible.builtin.apt:
        name: redis-server
        state: present
        update_cache: true

    - name: pathway config directory
      ansible.builtin.file:
        path: /etc/pathway
        state: directory
        mode: "0755"

    - name: pathway log directory
      ansible.builtin.file:
        path: /var/log/pathway
        state: directory
        owner: "{{ grove_user }}"
        group: "{{ grove_user }}"
        mode: "0755"

    # Ownership only: `file: recurse` would stamp the directory's mode onto payload.log.
    - name: hand the existing logs to the process
      ansible.builtin.command: "chown -Rc {{ grove_user }}:{{ grove_user }} /var/log/pathway"
      register: pathway_log_chown
      changed_when: pathway_log_chown.stdout | length > 0

    - name: keep the logs private
      ansible.builtin.command: "find /var/log/pathway -type f ! -perm 0640 -exec chmod -c 0640 {} +"
      register: pathway_log_mode
      changed_when: pathway_log_mode.stdout | length > 0

    - name: access log rotation
      ansible.builtin.copy:
        src: "{{ grove_dir }}/logrotate/pathway"
        dest: /etc/logrotate.d/pathway
        mode: "0644"

    - name: gateway binary
      ansible.builtin.copy:
        src: /tmp/pathway
        dest: /usr/local/bin/pathway
        mode: "0755"
        remote_src: true
      notify: restart pathway

    # GROVE_INGRESS_ID selects the infra plane; no tenant variable belongs here.
    - name: agent.env
      ansible.builtin.copy:
        dest: /etc/pathway/agent.env
        owner: frappe
        group: frappe
        content: |
          GROVE_ADMIN_TOKEN={{ admin_token }}
          GROVE_INGRESS_ID={{ ingress_id | default('') }}
          GROVE_INGRESS_TOKEN={{ data_token }}
          GROVE_REDIS_ADDR=127.0.0.1:6379
          GROVE_LISTEN_HTTP=:80
          GROVE_LISTEN_HTTPS=:443
          GROVE_SELF_HOST={{ ingress_hostname }}
          GROVE_TLS_CERT={{ fleet_tls_cert_path if (fleet_tls_cert | default('')) else '' }}
          GROVE_TLS_KEY={{ fleet_tls_key_path if (fleet_tls_cert | default('')) else '' }}
          GROVE_ACCESS_LOG=/var/log/pathway/access.log
          GROVE_ERROR_LOG=/var/log/pathway/error.log
          GROVE_CONFIG=/etc/pathway/config.json
          GROVE_PID_FILE=/run/pathway/pathway.pid
        mode: "0600"
      no_log: true
      notify: restart pathway

    - name: config.json
      ansible.builtin.template:
        src: "{{ grove_dir }}/config.json.j2"
        dest: /etc/pathway/config.json
        mode: "0644"
      notify: reload pathway config

    - name: systemd unit
      ansible.builtin.copy:
        src: "{{ grove_dir }}/systemd/pathway.service"
        dest: /etc/systemd/system/pathway.service
        mode: "0644"
      notify:
        - reload systemd
        - restart pathway

    - name: redis started
      ansible.builtin.systemd:
        name: redis-server
        enabled: true
        state: started

    - name: pathway started
      ansible.builtin.systemd:
        name: pathway
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: restart pathway
      ansible.builtin.systemd:
        name: pathway
        state: restarted
        daemon_reload: true

    - name: reload pathway config
      ansible.builtin.command: systemctl kill -s SIGUSR1 pathway
      changed_when: true
      failed_when: false
