---
- name: map system arch to a released asset arch
  ansible.builtin.set_fact:
    agent_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}.get(ansible_architecture, '') }}"

- name: refuse an architecture the agent does not publish
  ansible.builtin.fail:
    msg: "no pathway release for {{ ansible_architecture }} — only x86_64 and aarch64 are built"
  when: not agent_arch

# get_url matches the dest basename against sha256sums.txt, so the download keeps the asset's name.
- name: download pathway {{ agent_version }}
  ansible.builtin.get_url:
    url: "{{ agent_release_url }}/pathway-linux-{{ agent_arch }}"
    dest: "/tmp/pathway-linux-{{ agent_arch }}"
    checksum: "sha256:{{ agent_release_url }}/sha256sums.txt"
    mode: "0755"
  when: not agent_binary

- name: stage the binary under the name the install task copies from
  ansible.builtin.copy:
    src: "/tmp/pathway-linux-{{ agent_arch }}"
    dest: /tmp/pathway
    mode: "0755"
    remote_src: true
  when: not agent_binary

- name: stage a local build instead
  ansible.builtin.copy:
    src: "{{ agent_binary }}"
    dest: /tmp/pathway
    mode: "0755"
  when: agent_binary | length > 0

- name: pathway state directory
  ansible.builtin.file:
    path: /var/lib/pathway
    state: directory
    owner: "{{ grove_user | default('frappe') }}"
    group: "{{ grove_user | default('frappe') }}"
    mode: "0750"
