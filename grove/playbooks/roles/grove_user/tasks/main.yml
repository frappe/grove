---
# The runner callback harvests ssh_public_key off this task's result onto the server doc.
- name: Create the {{ grove_user }} user
  ansible.builtin.user:
    name: "{{ grove_user }}"
    uid: "{{ grove_user_uid }}"
    shell: /bin/bash
    generate_ssh_key: true
    ssh_key_type: ed25519
    ssh_key_file: .ssh/id_ed25519
    ssh_key_comment: "{{ grove_user }}@{{ inventory_hostname }}"
