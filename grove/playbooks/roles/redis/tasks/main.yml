---
- name: install redis-server
  ansible.builtin.apt:
    name: redis-server
    state: present
    update_cache: true

# The marker predates this role: renaming it writes a second block on every existing store.
# save: one pair per line, Redis 6.x ignores the one-line form.
- name: redis zero-loss persistence
  ansible.builtin.blockinfile:
    path: /etc/redis/redis.conf
    marker: "# {mark} grove gateway zero-loss"
    block: |
      appendonly yes
      appendfsync everysec
      maxmemory-policy noeviction
      save 3600 1
      save 300 100
      save 60 10000
      auto-aof-rewrite-percentage 100
      auto-aof-rewrite-min-size 256mb
      no-appendfsync-on-rewrite no
      stop-writes-on-bgsave-error yes

- name: redis listens for the gateways
  ansible.builtin.blockinfile:
    path: /etc/redis/redis.conf
    marker: "# {mark} grove state store network"
    block: |
      bind {{ redis_bind }}
      requirepass {{ redis_password }}
  no_log: true
  register: redis_network
  when: redis_password | length > 0

- name: restart redis onto its listen address and password
  ansible.builtin.systemd:
    name: redis-server
    state: restarted
  when: redis_network is changed

- name: redis started
  ansible.builtin.systemd:
    name: redis-server
    enabled: true
    state: started

- name: enforce persistence on the running redis
  ansible.builtin.shell: |
    set -eu
    changed=0
    for setting in "appendonly yes" "appendfsync everysec" "maxmemory-policy noeviction" \
                   "save 3600 1 300 100 60 10000" \
                   "auto-aof-rewrite-percentage 100" "auto-aof-rewrite-min-size 268435456" \
                   "no-appendfsync-on-rewrite no" "stop-writes-on-bgsave-error yes"; do
      key=${setting%% *}
      want=${setting#* }
      have=$(redis-cli config get "$key" | tail -1)
      if [ "$have" != "$want" ]; then
        redis-cli config set "$key" "$want" > /dev/null
        changed=1
      fi
    done
    echo "$changed"
  # redis-cli sends AUTH whenever REDISCLI_AUTH exists, so a blank password must set nothing.
  environment: "{{ {'REDISCLI_AUTH': redis_password} if redis_password else {} }}"
  register: redis_runtime_persistence
  changed_when: redis_runtime_persistence.stdout | trim == "1"
