---
- name: find the redis package to install
  ansible.builtin.include_tasks: repository.yml
  when: redis_package is not defined

# Redis runs as the service account from Grove's own unit, config and directories. The packages'
# unit of the same name is never read, and their /etc/redis, /var/lib/redis and /var/log/redis,
# which every install chowns back to `redis`, are not used.
- name: look for our own redis unit
  ansible.builtin.stat:
    path: /etc/systemd/system/redis-server.service
  register: redis_own_unit

- name: redis's own directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ redis_user }}"
    group: "{{ redis_user }}"
    mode: "0750"
  loop:
    - /etc/redis-server
    - /var/lib/redis-server
    - /var/log/redis-server

# The move off the packaged redis, once: stopped so that its files are whole, then copied. Its own
# directory is left as it was, which is the way back.
- name: stop the packaged redis for the move
  ansible.builtin.shell: |
    set -eu
    if systemctl is-active --quiet redis-server; then
      systemctl stop redis-server
      echo stopped
    fi
  register: redis_packaged
  changed_when: redis_packaged.stdout | trim == "stopped"
  when: not redis_own_unit.stat.exists

- name: adopt the data the packaged redis held
  ansible.builtin.shell: |
    set -eu
    if [ -z "$(ls -A "$OURS")" ] && [ -n "$(ls -A "$THEIRS" 2>/dev/null)" ]; then
      cp -a "$THEIRS/." "$OURS/"
      chown -R "$OWNER:$OWNER" "$OURS"
      echo adopted
    fi
  environment:
    OURS: /var/lib/redis-server
    THEIRS: /var/lib/redis
    OWNER: "{{ redis_user }}"
  register: redis_adopted
  changed_when: redis_adopted.stdout | trim == "adopted"
  when: not redis_own_unit.stat.exists

- name: redis config
  ansible.builtin.template:
    src: redis.conf.j2
    dest: /etc/redis-server/redis.conf
    owner: "{{ redis_user }}"
    group: "{{ redis_user }}"
    mode: "0640"
  no_log: true
  register: redis_conf

- name: redis unit
  ansible.builtin.template:
    src: redis-server.service.j2
    dest: /etc/systemd/system/redis-server.service
    mode: "0644"
  register: redis_unit

- name: load the unit
  ansible.builtin.systemd:
    daemon_reload: true
  when: redis_unit is changed

# The package starts `redis-server` as it lands: by now that name is the unit above.
- name: install redis
  ansible.builtin.apt:
    name:
      - "redis-server={{ redis_package }}"
      - "redis-tools={{ redis_package }}"
    state: present

# A task, not a handler: a handler that failed to fire once never fires again, the file being right.
- name: restart redis onto a changed config or unit
  ansible.builtin.systemd:
    name: redis-server
    state: restarted
  when: redis_conf is changed or redis_unit is changed

- name: redis started
  ansible.builtin.systemd:
    name: redis-server
    enabled: true
    state: started

- name: enforce persistence on the running redis
  ansible.builtin.shell: |
    set -eu
    changed=0
    for setting in "appendonly yes" "appendfsync everysec" "maxmemory-policy noeviction" \
                   "save 3600 1 300 100 60 10000" \
                   "auto-aof-rewrite-percentage 100" "auto-aof-rewrite-min-size 268435456" \
                   "no-appendfsync-on-rewrite no" "stop-writes-on-bgsave-error yes"; do
      key=${setting%% *}
      want=${setting#* }
      have=$(redis-cli config get "$key" | tail -1)
      if [ "$have" != "$want" ]; then
        redis-cli config set "$key" "$want" > /dev/null
        changed=1
      fi
    done
    echo "$changed"
  # redis-cli sends AUTH whenever REDISCLI_AUTH exists, so a blank password must set nothing.
  environment: "{{ {'REDISCLI_AUTH': redis_password} if redis_password else {} }}"
  register: redis_runtime_persistence
  changed_when: redis_runtime_persistence.stdout | trim == "1"

# gateway_store.py reads this task's stdout: what the box runs, which `redis_version` only bounds.
- name: read the running redis version
  ansible.builtin.shell: >-
    redis-cli info server | awk -F: '/^redis_version:/ {print $2}' | tr -d '\r'
  environment: "{{ {'REDISCLI_AUTH': redis_password} if redis_password else {} }}"
  register: redis_running
  changed_when: false
  failed_when: redis_running.stdout | trim != redis_release
