---
grove_tls_dir: /etc/grove/tls
grove_tls_cert: "{{ grove_tls_dir }}/box.crt"
grove_tls_key: "{{ grove_tls_dir }}/box.key"

grove_tls_subject: /CN=grove-box
# Nothing renews or verifies it; delete the file and re-run to reissue.
grove_tls_days: 90

# Only the inference box's nginx needs one on disk to start `listen 443 ssl`; front boxes set false.
grove_tls_selfsigned: true

# The hash comes from Grove Settings: htpasswd here would put the password in argv, which the
# Ansible Task doc records, and re-salt on every run.
grove_metrics_htpasswd: /etc/grove/nginx/metrics.htpasswd
# Must equal monitoring_scrape_username in the vmagent role (TestScrapeCredentialsAgree).
scrape_username: grove
scrape_password_hash: ""
