---
- name: Verify an NVIDIA driver is present and working
  ansible.builtin.command: nvidia-smi
  register: dcgm_nvidia_smi
  changed_when: false
  failed_when: dcgm_nvidia_smi.rc != 0

- name: Add NVIDIA's CUDA repository
  ansible.builtin.apt:
    deb: "{{ dcgm_cuda_keyring_url }}"

- name: Install DCGM and its exporter
  ansible.builtin.apt:
    name: "{{ dcgm_packages }}"
    state: present
    update_cache: true
  async: 1800
  poll: 15

- name: Enable and start DCGM and its exporter
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
    daemon_reload: true
  loop:
    - nvidia-dcgm
    - nvidia-dcgm-exporter

- name: Check the DCGM exporter answers
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ dcgm_exporter_port }}/metrics"
    return_content: false
  retries: 10
  delay: 3
  register: dcgm_health
  until: dcgm_health.status == 200
