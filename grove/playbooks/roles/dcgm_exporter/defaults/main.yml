---
# DCGM 4.x: 3.x does not know Blackwell cards and silently reports nothing for them.
dcgm_packages:
  - datacenter-gpu-manager-4-cuda12
  - datacenter-gpu-manager-exporter

dcgm_cuda_keyring_url: https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb

# What the shipped unit listens on; grove/monitoring.py hands the agent the same (tests/test_monitoring.py).
dcgm_exporter_port: 9400
