---
# A cap that leaves pathway nothing, or one past the box's RAM, is a typo on the server doc or a box
# too small for the reserve. Refused before the drop-in is touched.
- name: refuse a memory cap the box cannot hold
  ansible.builtin.assert:
    that:
      - pathway_memory_cap_mb | int >= 128
      - pathway_memory_cap_mb | int < ansible_memtotal_mb | int
    fail_msg: >-
      pathway would be capped at {{ pathway_memory_cap_mb }} MB on a box with
      {{ ansible_memtotal_mb }} MB — set Memory Limit between 128 and the box's RAM, or leave it
      blank for the RAM less {{ pathway_memory_reserve_mb }} MB.

- name: pathway drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/pathway.service.d
    state: directory
    mode: "0755"

- name: pathway memory cap
  ansible.builtin.template:
    src: memory.conf.j2
    dest: /etc/systemd/system/pathway.service.d/memory.conf
    mode: "0644"
  register: pathway_memory_cap

# MemoryMax is a cgroup setting, so a daemon-reload puts it on the running process. GOMEMLIMIT is
# read when pathway starts, and a SIGHUP child copies its parent's environment: it waits for the
# next restart, which this role never causes.
- name: put the cap on the running unit
  ansible.builtin.systemd:
    daemon_reload: true
  when: pathway_memory_cap is changed
