---
# Pinned: security fixes do not arrive with unattended-upgrades, so bumping this is a fleet-wide job.
openresty_version: "1.31.1.1"

openresty_keyring: /usr/share/keyrings/openresty.gpg
openresty_list: /etc/apt/sources.list.d/openresty.list

# The package does not create it, and OpenResty refuses to start without its error log.
openresty_log_dir: /var/log/openresty
