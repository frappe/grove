---
fleet_tls_dir: /etc/grove/tls
fleet_tls_cert_path: "{{ fleet_tls_dir }}/fleet.crt"
fleet_tls_key_path: "{{ fleet_tls_dir }}/fleet.key"
# A literal: deploy_tls.yml runs this role with no grove_user in scope.
fleet_tls_key_owner: frappe

fleet_tls_cert: ""
fleet_tls_key: ""

gateway_host: ""
proxy_hostname: ""
