---
- name: Install auditd
  ansible.builtin.apt:
    name: auditd
    state: present
    update_cache: true

- name: Keep auditd enabled and running
  ansible.builtin.service:
    name: auditd
    state: started
    enabled: true

# Container storage pruned: a rule on an image layer's path breaks the whole load once the image is gone.
- name: List setuid and setgid binaries
  ansible.builtin.command: >-
    find / -xdev ( -path /var/lib/docker -o -path /var/lib/containerd -o -path /opt/vllm ) -prune
    -o -type f ( -perm -4000 -o -perm -2000 ) -print
  register: auditd_privileged_binaries
  changed_when: false
  failed_when: auditd_privileged_binaries.stdout_lines | length == 0
  check_mode: false

- name: Write the audit rules
  ansible.builtin.template:
    src: grove.rules.j2
    dest: /etc/audit/rules.d/grove.rules
    owner: root
    group: root
    mode: "0600"
  notify: load audit rules
