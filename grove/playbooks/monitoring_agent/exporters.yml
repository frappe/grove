---
# Exporters for one box behind the scrape htpasswd: the re-run for a rotated Scrape Password or
# cards that appeared after Setup (Update Scrape Auth). extra-vars: monitoring_has_gpu, scrape_password_hash.
- name: Install the metrics exporters
  hosts: all
  become: true
  gather_facts: true
  vars:
    monitoring_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
  roles:
    - role: grove_https
      vars:
        grove_tls_selfsigned: false
    - node_exporter
    - role: dcgm_exporter
      when: monitoring_has_gpu | bool
