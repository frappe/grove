---
# Install one fleet's vmagent and its own node_exporter (monitoring_agent.provision). extra-vars:
# Monitoring Agent.ansible_variables (the monitoring_* and vmagent_* the vmagent role reads).
- name: Install the metrics agent
  hosts: all
  become: true
  gather_facts: true
  vars:
    monitoring_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
    node_exporter_bind: 127.0.0.1
  pre_tasks:
    - name: Check where to push
      ansible.builtin.assert:
        that:
          - monitoring_remote_write_url | length > 0
          - monitoring_remote_write_token | length > 0
          - monitoring_agent | length > 0
        fail_msg: >-
          This agent has nowhere to push. Grove does not run the metrics backend — set a Remote
          Write URL on this agent's Region (or the fleet-wide one in Grove Settings) and a
          Metrics Token on the agent itself before installing it.

    - name: Check what to scrape the boxes as
      ansible.builtin.assert:
        that:
          - monitoring_scrape_password | length > 0
        fail_msg: >-
          No metrics scrape password. Every box serves /metrics/node and /metrics/gpu behind
          basic auth, so without it this agent installs and is then refused by every host
          target it has — set Metrics Scrape Password in Grove Settings.

    - name: Check where to ask what to scrape
      when: not (monitoring_static_targets | bool)
      ansible.builtin.assert:
        that:
          - monitoring_sd_url | length > 0
          - monitoring_sd_token | length > 0
        fail_msg: >-
          This agent has nothing to fetch targets with. Set a Service Discovery Token in Grove
          Settings, or tick Push Targets Manually on the agent to have Grove write the lists.
  roles:
    - grove_user
    - remove_cloud_user
    - auditd
    - node_exporter
    - vmagent
