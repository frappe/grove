---
- name: Create the config directory
  ansible.builtin.file:
    path: "{{ vmagent_config_dir }}"
    state: directory
    mode: "0755"

- name: Create the buffer directory
  ansible.builtin.file:
    path: "{{ vmagent_buffer_path }}"
    state: directory
    owner: "{{ vmagent_user }}"
    group: "{{ vmagent_user }}"
    mode: "0755"

# Ownership only: `file: recurse` would stamp the directory's mode onto every file.
- name: Hand the existing buffer to vmagent
  ansible.builtin.command: "chown -Rc {{ vmagent_user }}:{{ vmagent_user }} {{ vmagent_buffer_path }}"
  register: vmagent_buffer_chown
  changed_when: vmagent_buffer_chown.stdout | length > 0

# In files, not the argv: /proc/<pid>/cmdline is world-readable, and the Ansible Task doc records what ran.
- name: Write the remote write token
  ansible.builtin.copy:
    content: "{{ monitoring_remote_write_token }}"
    dest: "{{ vmagent_config_dir }}/remote_write.token"
    owner: "{{ vmagent_user }}"
    mode: "0600"
  no_log: true
  notify: restart vmagent

- name: Write the metrics scrape password
  ansible.builtin.copy:
    content: "{{ monitoring_scrape_password }}"
    dest: "{{ vmagent_config_dir }}/scrape.password"
    owner: "{{ vmagent_user }}"
    mode: "0600"
  no_log: true
  notify: restart vmagent

- name: Drop the superseded service-discovery token file
  ansible.builtin.file:
    path: "{{ vmagent_config_dir }}/sd.token"
    state: absent

- name: Write the scrape config and any pushed target lists
  ansible.builtin.include_tasks: targets.yml

- name: Write the vmagent unit
  ansible.builtin.template:
    src: vmagent.service.j2
    dest: /etc/systemd/system/vmagent.service
    mode: "0644"
  notify: restart vmagent

- name: Enable and start vmagent
  ansible.builtin.systemd:
    name: vmagent
    state: started
    enabled: true
    daemon_reload: true

- name: Flush handlers so the health check sees the current config
  ansible.builtin.meta: flush_handlers

- name: Check vmagent answers
  ansible.builtin.uri:
    url: "http://{{ vmagent_listen_address }}/health"
    return_content: false
    status_code: 200
  retries: 15
  delay: 4
  register: vmagent_health
  until: vmagent_health.status == 200
  failed_when: false

- name: Report why vmagent is not answering
  when: vmagent_health.status != 200
  ansible.builtin.command: journalctl -u vmagent -n 30 --no-pager
  changed_when: false
  failed_when: true
