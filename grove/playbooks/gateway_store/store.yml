---
# Provision a Gateway Store: the Redis a Network's gateways share. extra-vars: redis_bind_ip, redis_password.
- hosts: all
  become: true
  gather_facts: true

  pre_tasks:
    - name: refuse to provision without a password
      ansible.builtin.assert:
        that:
          - redis_password | default('') | trim | length > 0
          - redis_bind_ip | default('') | trim | length > 0
        fail_msg: >-
          redis_password and redis_bind_ip are required — provision from the Gateway Store's
          Setup button, or pass the same extra-vars it does.

  roles:
    - grove_user
    - remove_cloud_user
    - auditd
    - role: redis
      vars:
        redis_bind: "127.0.0.1 {{ redis_bind_ip }}"
