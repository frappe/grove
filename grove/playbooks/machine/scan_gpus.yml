---
# Read the box's GPU inventory off nvidia-smi (machine.scan_gpus parses the task output). Read-only.
- name: Scan GPUs
  hosts: all
  become: true
  gather_facts: false
  tasks:
    # The task NAME is the contract: machine.scan_gpus finds this task's Ansible Task doc by it,
    # and parses these exact CSV columns (nounits: memory as a bare MiB int).
    - name: query nvidia-smi
      ansible.builtin.command:
        cmd: nvidia-smi --query-gpu=index,name,memory.total,uuid,memory.used,memory.free,compute_cap --format=csv,noheader,nounits
      register: nvidia_smi
      changed_when: false

    # Parsed by machine.parse_interconnect; non-fatal so a topo hiccup cannot sink the inventory.
    - name: query nvidia-smi topo
      ansible.builtin.command:
        cmd: nvidia-smi topo -m
      register: nvidia_smi_topo
      changed_when: false
      failed_when: false
