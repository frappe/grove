---
# Probe first: installing nvidia_driver_pkg over a working newer or .run driver is an apt
# "changed" that reboots a serving box onto an older driver.
- name: Probe nvidia-smi
  ansible.builtin.command: nvidia-smi
  register: nvidia_smi_probe
  changed_when: false
  failed_when: false

- name: Install the NVIDIA driver
  when: nvidia_smi_probe.rc != 0
  block:
    - name: Install kernel headers + ubuntu-drivers-common
      ansible.builtin.apt:
        name:
          - "linux-headers-{{ ansible_kernel }}"
          - ubuntu-drivers-common
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Install NVIDIA driver
      ansible.builtin.apt:
        name: "{{ nvidia_driver_pkg }}"
        state: present
      async: 1800
      poll: 15

    - name: Reboot to load the NVIDIA kernel module
      ansible.builtin.reboot:
        reboot_timeout: "{{ gpu_reboot_timeout }}"

- name: Verify the GPU is visible
  ansible.builtin.command: nvidia-smi --query-gpu=name,memory.total,driver_version --format=csv,noheader
  register: gpu_info
  changed_when: false

- name: GPU
  ansible.builtin.debug:
    var: gpu_info.stdout_lines

- name: Install GPU monitoring tools (nvtop)
  ansible.builtin.apt:
    name: "{{ gpu_host_monitor_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: gpu_host_monitor_packages | length > 0

- name: Ensure the mount point exists
  ansible.builtin.file:
    path: "{{ gpu_data_mount }}"
    state: directory
    mode: "0755"

- name: Is a data volume already mounted?
  ansible.builtin.command: "findmnt -no SOURCE {{ gpu_data_mount }}"
  register: data_mounted
  changed_when: false
  failed_when: false

- name: Keep the data volume an earlier run mounted
  ansible.builtin.set_fact:
    gpu_data_disk: "{{ data_mounted.stdout | trim }}"
  when: data_mounted.rc == 0

- name: Pick the data volume
  when: data_mounted.rc != 0
  block:
    # --sort flattens lsblk's tree: partitions arrive as siblings of their disk, tied to it by PKNAME.
    - name: Read the block devices, largest last
      ansible.builtin.command: >-
        lsblk --json --bytes --sort SIZE
        --output NAME,PATH,TYPE,SIZE,FSTYPE,MOUNTPOINT,PKNAME,MODEL,RM,RO
      register: lsblk_json
      changed_when: false

    - name: Find the disk the root filesystem lives on
      ansible.builtin.shell: "lsblk -no PKNAME $(findmnt -no SOURCE /)"
      register: root_disk
      changed_when: false

    - name: Shortlist the disks nothing else is using
      vars:
        devices: "{{ (lsblk_json.stdout | from_json).blockdevices }}"
        parents: "{{ devices | map(attribute='pkname') | reject('none') | list }}"
        spare: >-
          {{ devices
             | selectattr('type', 'equalto', 'disk')
             | rejectattr('name', 'in', parents)
             | selectattr('mountpoint', 'none')
             | selectattr('rm', 'in', [false, '0'])
             | selectattr('ro', 'in', [false, '0'])
             | list }}
      ansible.builtin.set_fact:
        gpu_spare_disks: "{{ spare | map(attribute='path') | list }}"
        gpu_free_disks: >-
          {{ spare | selectattr('fstype', 'none')
                   | rejectattr('model', 'in', gpu_ephemeral_disk_models)
                   | map(attribute='path') | list }}

    - name: Refuse a pinned data device that is in use
      ansible.builtin.assert:
        that: gpu_data_device in gpu_spare_disks
        fail_msg: >-
          gpu_data_device {{ gpu_data_device }} is not a spare whole disk — it is missing,
          partitioned, or something is mounted on it. Root is on
          /dev/{{ root_disk.stdout | trim }}. Refusing to format it.
      when: gpu_data_device | length > 0

    - name: Choose the data device
      ansible.builtin.set_fact:
        gpu_data_disk: "{{ gpu_data_device or (gpu_free_disks[-1] if gpu_free_disks else '') }}"

- name: Put the data volume on {{ gpu_data_mount }}
  when: data_mounted.rc != 0 and gpu_data_disk | length > 0
  block:
    - name: Detect existing filesystem on the data device
      ansible.builtin.command: "blkid -s TYPE -o value {{ gpu_data_disk }}"
      register: data_fs
      changed_when: false
      failed_when: false

    - name: Format the data device (only if unformatted)
      ansible.builtin.command: "mkfs.{{ gpu_data_fstype }} -F {{ gpu_data_disk }}"
      when: (data_fs.stdout | trim) | length == 0

    - name: Read the data device UUID
      ansible.builtin.command: "blkid -s UUID -o value {{ gpu_data_disk }}"
      register: data_uuid
      changed_when: false

    - name: Persist the mount in /etc/fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '\s{{ gpu_data_mount }}\s'
        line: "UUID={{ data_uuid.stdout }} {{ gpu_data_mount }} {{ gpu_data_fstype }} defaults,nofail 0 2"

    - name: Mount the data volume
      ansible.builtin.command: "mount {{ gpu_data_mount }}"

- name: Data volume
  ansible.builtin.debug:
    msg: >-
      {{ gpu_data_mount }} is on {{ gpu_data_disk | default('', true) or 'the root volume' }}
      ({{ root_free_gb }} GB free on /)
  vars:
    root_free_gb: >-
      {{ ((ansible_mounts | selectattr('mount', 'equalto', '/')
           | map(attribute='size_available') | list | default([0], true) | first | int)
          / 1073741824) | round | int }}

# After the mount: Docker's data-root lives on the data volume.
- name: Fetch the NVIDIA container-toolkit signing key
  ansible.builtin.get_url:
    url: https://nvidia.github.io/libnvidia-container/gpgkey
    dest: /usr/share/keyrings/nvidia-container-toolkit.asc
    mode: "0644"

- name: Add the NVIDIA container-toolkit repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/nvidia-container-toolkit.list
    content: "deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit.asc] https://nvidia.github.io/libnvidia-container/stable/deb/$(ARCH) /\n"
    mode: "0644"

# All four toolkit packages pinned together: apt resolves an unpinned one to the repo's newest
# build, which the pinned toolkit then fails to depend on.
- name: Install Docker and the NVIDIA container toolkit
  ansible.builtin.apt:
    name:
      - docker.io
      - "nvidia-container-toolkit={{ nvidia_container_toolkit_version }}"
      - "nvidia-container-toolkit-base={{ nvidia_container_toolkit_version }}"
      - "libnvidia-container-tools={{ nvidia_container_toolkit_version }}"
      - "libnvidia-container1={{ nvidia_container_toolkit_version }}"
    state: present
    update_cache: true
  async: 1800
  poll: 15

# Not in the list above: noble's archive has no criu, and a missing package there fails the
# whole provision.
- name: Install CRIU where the archive has it
  ansible.builtin.apt:
    name: criu
    state: present
  register: gpu_host_criu
  failed_when: false
  changed_when: gpu_host_criu.changed | default(false)

- name: Install cuda-checkpoint
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/NVIDIA/cuda-checkpoint/main/bin/x86_64_Linux/cuda-checkpoint
    dest: /usr/local/bin/cuda-checkpoint
    mode: "0755"

# Not `nvidia-ctk runtime configure`: it rewrites this file, fights the data-root below and
# bounces Docker on each Setup.
- name: Read the Docker daemon config
  ansible.builtin.slurp:
    src: /etc/docker/daemon.json
  register: docker_daemon
  failed_when: false

- name: Configure the Docker daemon (images on the data volume + the NVIDIA runtime)
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: "{{ docker_daemon_config | combine(docker_daemon_wanted, recursive=true) | to_nice_json }}\n"
    mode: "0644"
  vars:
    docker_daemon_config: "{{ (docker_daemon.content | b64decode | from_json) if docker_daemon.content is defined else {} }}"
    docker_daemon_wanted:
      data-root: "{{ gpu_data_mount }}/docker"
      # Docker 29 defaults to the containerd image store, which keeps layers under
      # /var/lib/containerd whatever data-root says.
      features:
        containerd-snapshotter: false
      # `docker checkpoint` is gated daemon-wide behind this.
      experimental: true
      runtimes:
        nvidia:
          path: nvidia-container-runtime
          args: []
  notify: restart docker

# fstab is nofail: without this, a late mount leaves dockerd on an empty data-root, quietly.
- name: Ensure the Docker unit drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    mode: "0755"

- name: Order Docker after the data volume mount
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker.service.d/data-volume.conf
    content: |
      [Unit]
      RequiresMountsFor={{ gpu_data_mount }}
    mode: "0644"
  notify: restart docker

- name: Mount the instance-store NVMe for the HF cache
  ansible.builtin.import_tasks: instance_store.yml
  when: gpu_instance_store_hf_cache | bool
