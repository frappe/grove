---
# vLLM's torch CUDA build (cu13) needs driver >= 580.
nvidia_driver_pkg: nvidia-driver-580-server

gpu_reboot_timeout: 600

nvidia_container_toolkit_version: "1.19.1-1"

gpu_host_monitor_packages:
  - nvtop

gpu_data_device: ""
gpu_data_mount: /opt/vllm
gpu_data_fstype: ext4

gpu_ephemeral_disk_models:
  - Amazon EC2 NVMe Instance Storage

# HF cache only: the instance store is blank after a stop/start, so weights re-download.
gpu_instance_store_hf_cache: false
gpu_instance_store_mount: /mnt/instance
