---
engine_proxy_port: 443

# The whole packaged nginx.conf: OpenResty ships neither conf.d nor sites-enabled.
engine_proxy_conf: /usr/local/openresty/nginx/conf/nginx.conf

engine_proxy_engines_dir: /etc/grove/nginx/engines

# Must match what grove/monitoring.py hands the agent as __metrics_path__ (TestExporterPortsAgree).
engine_proxy_node_metrics_path: /metrics/node
engine_proxy_gpu_metrics_path: /metrics/gpu

# Restated from the exporter roles, which serve.yml does not run; asserted equal in the tests.
engine_proxy_node_upstream: 127.0.0.1:9100
engine_proxy_gpu_upstream: 127.0.0.1:9400

engine_proxy_max_body_size: 32m
