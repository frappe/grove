---
# Handlers run in definition order, so the check stays first: a reload alone exits 0 on a bad
# config, which then takes every engine down at the next restart.
- name: check engine proxy config
  ansible.builtin.command: /usr/local/openresty/bin/openresty -t
  changed_when: false

- name: reload engine proxy
  ansible.builtin.systemd:
    name: openresty
    state: reloaded
