---
vllm_instance: default
vllm_unit: "vllm-{{ vllm_instance }}"

vllm_user: root
vllm_home: /opt/vllm
# Never under /root: the root disk is small and weights are multi-GB.
vllm_cache_dir: "{{ vllm_home }}/cache"
vllm_hf_home: "{{ vllm_home }}/hf"
vllm_api_key_file: "{{ vllm_home }}/keys/{{ vllm_instance }}.key"

vllm_image: ""
vllm_registry_host: ""
vllm_registry_username: ""
vllm_registry_token: ""
vllm_container_dir: "{{ vllm_home }}/containers"
vllm_container_script: "{{ vllm_container_dir }}/{{ vllm_unit }}.sh"
vllm_container_env_file: "{{ vllm_container_dir }}/{{ vllm_unit }}.env"

vllm_port: 8080
vllm_serve_args: []
# vLLM takes repo:QUANT for a GGUF ref; hf download wants the repo and a file glob. Derived
# here, not in a task: reconfigure.yml renders the env file without the serve tasks.
vllm_model: ""
vllm_download_repo: "{{ vllm_model.split(':')[0] }}"
vllm_download_glob: "{{ '*' + vllm_model.split(':')[1] + '.gguf' if ':' in vllm_model else '' }}"
vllm_env: {}
vllm_predownload_model: true
vllm_image_gb: 0
vllm_weights_gb: 0

vllm_cache_bucket: ""
vllm_cache_sync_env: {}
vllm_tensor_parallel_size: 1
vllm_model_slug: ""
vllm_cache_sync_script: "{{ vllm_container_dir }}/{{ vllm_unit }}-cache-sync.sh"

vllm_api_key: ""
vllm_hf_token: ""

vllm_wait_for_healthy: true
vllm_health_path: /health
vllm_engine_kind: vllm

vllm_warmup: true
vllm_warmup_request: {}
