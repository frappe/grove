---
# Run on its own by reconfigure.yml: nothing here downloads, pulls or checks disk.
- name: Resolve effective API key
  ansible.builtin.set_fact:
    vllm_effective_api_key: >-
      {{ vllm_api_key if (vllm_api_key | length > 0)
         else (vllm_api_key_slurp.content | b64decode | trim) }}

- name: Write the container environment file
  ansible.builtin.template:
    src: vllm-container.env.j2
    dest: "{{ vllm_container_env_file }}"
    mode: "0600"
  notify: recreate vllm container

- name: Write the compile-cache sync script
  ansible.builtin.template:
    src: vllm-cache-sync.sh.j2
    dest: "{{ vllm_cache_sync_script }}"
    mode: "0700"
  when: vllm_cache_bucket | length > 0

- name: Write the container run script
  ansible.builtin.template:
    src: vllm-container-run.sh.j2
    dest: "{{ vllm_container_script }}"
    mode: "0700"
  notify: recreate vllm container

- name: Flush handlers so a changed config is applied before the health check
  ansible.builtin.meta: flush_handlers

- name: Check whether the engine container is running
  ansible.builtin.command: "docker ps --quiet --filter name=^{{ vllm_unit }}$ --filter status=running"
  register: vllm_container_ps
  changed_when: false

- name: Start the engine container
  ansible.builtin.command: "{{ vllm_container_script }}"
  when: (vllm_container_ps.stdout | default('')) | length == 0

- name: Wait for the engine to become healthy
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ vllm_port }}{{ vllm_health_path }}"
    headers:
      Authorization: "Bearer {{ vllm_effective_api_key }}"
    status_code: 200
  register: vllm_health
  until: vllm_health.status == 200
  retries: 90
  delay: 10
  changed_when: false
  when: (vllm_wait_for_healthy | bool) and (vllm_health_path | length > 0)

- name: Prove the engine can run a forward pass
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ vllm_port }}{{ vllm_warmup_request.path }}"
    method: POST
    headers:
      Authorization: "Bearer {{ vllm_effective_api_key }}"
    body_format: json
    body: "{{ vllm_warmup_request.body | to_json }}"
    status_code: 200
    timeout: 120
  register: vllm_warmup_result
  until: vllm_warmup_result.status == 200
  retries: 2
  delay: 5
  changed_when: false
  when: vllm_warmup | bool and vllm_warmup_request | length > 0

- name: Show endpoint summary
  ansible.builtin.debug:
    msg:
      - "vLLM is up: http://{{ ansible_host | default(inventory_hostname) }}:{{ vllm_port }}/v1"
      - "Container: {{ vllm_unit }} (image {{ vllm_image }}) — docker ps / docker logs {{ vllm_unit }}"
      - "Model served as: {{ vllm_served_name }}"
      - "API key file on host: {{ vllm_api_key_file }}"
