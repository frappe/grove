---
- name: Check an engine image was passed
  ansible.builtin.assert:
    that: vllm_image | length > 0
    fail_msg: >-
      vllm_image is empty. This role serves from a container image — set Engine Image on the
      Model Replica.

- name: Verify an NVIDIA driver is present and working
  ansible.builtin.command: nvidia-smi
  register: vllm_nvidia_smi
  changed_when: false
  failed_when: vllm_nvidia_smi.rc != 0

- name: Create vLLM base directory
  ansible.builtin.file:
    path: "{{ vllm_home }}"
    state: directory
    owner: "{{ vllm_user }}"
    mode: "0755"

- name: Create the per-instance key dir + the container config dir
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ vllm_user }}"
    mode: "0755"
  loop:
    - "{{ vllm_home }}/keys"
    - "{{ vllm_container_dir }}"

- name: Note whether the weights share the data volume
  ansible.builtin.set_fact:
    vllm_weights_on_data: "{{ (vllm_hf_home ~ '/').startswith(vllm_home ~ '/') }}"

- name: Is the engine image already on the box?
  ansible.builtin.command: "docker image inspect {{ vllm_image }}"
  register: vllm_image_present
  changed_when: false
  failed_when: false

- name: Are the weights already in the shared cache?
  ansible.builtin.stat:
    path: "{{ vllm_hf_home }}/hub/models--{{ vllm_download_repo | replace('/', '--') }}"
  register: vllm_weights_cached

- name: Read the free space on the data path
  ansible.builtin.command: "df --output=avail --block-size=1G {{ vllm_home }}"
  register: vllm_df
  changed_when: false

- name: Check the data path can hold what is still to be downloaded
  vars:
    free_gb: "{{ vllm_df.stdout_lines[-1] | trim | regex_replace('G$', '') | int }}"
    image_gb: "{{ 0 if vllm_image_present.rc == 0 else vllm_image_gb }}"
    weights_gb: "{{ 0 if (not (vllm_predownload_model | bool) or vllm_weights_cached.stat.exists or not (vllm_weights_on_data | bool)) else vllm_weights_gb }}"
    needed_gb: "{{ (image_gb | float + weights_gb | float) | round(1) }}"
  ansible.builtin.assert:
    that: needed_gb | float == 0 or free_gb | int >= needed_gb | float
    fail_msg: >-
      {{ vllm_home }} has {{ free_gb }} GB free, but this deploy still has to download
      {{ needed_gb }} GB there ({{ image_gb }} GB of engine image, {{ weights_gb }} GB of
      weights). Grow this box's root volume — Resize Root Volume on its Machine — and run
      again. Note the image needs more room than it downloads: its layers arrive compressed
      and are unpacked onto the same disk.
    success_msg: >-
      {{ vllm_home }} has {{ free_gb }} GB free for {{ needed_gb }} GB of downloads.

- name: Check the separate weights mount
  when: (vllm_predownload_model | bool) and not (vllm_weights_on_data | bool)
  block:
    - name: Is the weights path a real mount?
      ansible.builtin.command: "findmnt -no SOURCE {{ vllm_hf_home | dirname }}"
      register: vllm_hf_mount
      changed_when: false
      failed_when: false

    - name: Refuse to download onto an unmounted mount point
      ansible.builtin.assert:
        that: vllm_hf_mount.rc == 0
        fail_msg: >-
          {{ vllm_hf_home | dirname }} is not mounted. This server opted into the
          instance-store HF cache — run Setup on the Inference Server so
          grove-instance-store.service exists, then deploy again.

    - name: Read the free space on the weights mount
      ansible.builtin.command: "df --output=avail --block-size=1G {{ vllm_hf_home | dirname }}"
      register: vllm_hf_df
      changed_when: false

    - name: Check the weights mount can hold what is still to be downloaded
      vars:
        free_gb: "{{ vllm_hf_df.stdout_lines[-1] | trim | regex_replace('G$', '') | int }}"
        weights_gb: "{{ 0 if vllm_weights_cached.stat.exists else vllm_weights_gb }}"
      ansible.builtin.assert:
        that: weights_gb | float == 0 or free_gb | int >= weights_gb | float
        fail_msg: >-
          {{ vllm_hf_home | dirname }} has {{ free_gb }} GB free, but {{ weights_gb }} GB of
          weights are still to download. The instance store is too small for this model —
          untick Use Instance Store For HF Cache on the Inference Server.

- name: Log in to the image registry
  ansible.builtin.command: "docker login {{ vllm_registry_host }} --username {{ vllm_registry_username }} --password-stdin"
  args:
    stdin: "{{ vllm_registry_token }}"
  no_log: true
  changed_when: false
  when: vllm_registry_token | length > 0

# The wait below notifies a recreate: the run script names the image REF, so a moved tag
# renders byte-identical and nothing else would replace the container.
- name: Pull the engine image (multi-GB on a first pull)
  ansible.builtin.command: "docker pull {{ vllm_image }}"
  register: vllm_pull_job
  async: 5400
  poll: 0

- name: Create cache directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ vllm_user }}"
    mode: "0755"
  loop:
    - "{{ vllm_cache_dir }}/torchinductor"
    - "{{ vllm_cache_dir }}/triton"
    - "{{ vllm_hf_home }}"

- name: Ensure python3 can create a virtualenv
  ansible.builtin.apt:
    name: python3-venv
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install hf + awscli into a host venv
  ansible.builtin.pip:
    name:
      - huggingface_hub[hf_transfer]
      - awscli
    virtualenv: "{{ vllm_home }}/hf-venv"
    virtualenv_command: python3 -m venv

- name: Write Hugging Face token (optional)
  ansible.builtin.copy:
    dest: "{{ vllm_hf_home }}/token"
    content: "{{ vllm_hf_token }}"
    owner: "{{ vllm_user }}"
    mode: "0600"
  when: vllm_hf_token | length > 0

- name: Generate and persist an API key (only when one is not supplied)
  ansible.builtin.shell: >-
    openssl rand -hex 24 > {{ vllm_api_key_file }}
    && chmod 600 {{ vllm_api_key_file }}
  args:
    creates: "{{ vllm_api_key_file }}"
  when: vllm_api_key | length == 0

- name: Read persisted API key
  ansible.builtin.slurp:
    src: "{{ vllm_api_key_file }}"
  register: vllm_api_key_slurp
  when: vllm_api_key | length == 0

# The token rides the environment, not the argv: Ansible records the argv on the Ansible Task doc.
- name: Pre-download model weights into the shared cache
  ansible.builtin.command: >-
    {{ vllm_home }}/hf-venv/bin/hf download {{ vllm_download_repo }}
    {{ '--include ' + vllm_download_glob if vllm_download_glob else '' }}
  environment:
    HF_TOKEN: "{{ vllm_hf_token }}"
    HF_HOME: "{{ vllm_hf_home }}"
    HF_XET_HIGH_PERFORMANCE: "1"
    HF_HUB_DISABLE_TELEMETRY: "1"
  args:
    # Down to the file for a GGUF ref: the quantizations share one repo, so a repo-level guard
    # would skip a switch from Q4_K_M to Q8_0.
    creates: >-
      {{ vllm_hf_home }}/hub/models--{{ vllm_download_repo | replace('/', '--') }}{{
      '/snapshots/*/' + vllm_download_glob if vllm_download_glob else '' }}
  when: vllm_predownload_model | bool
  async: 7200
  poll: 15
  tags: heavy

- name: Wait for the image pull to finish
  ansible.builtin.async_status:
    jid: "{{ vllm_pull_job.ansible_job_id }}"
  register: vllm_pull
  until: vllm_pull.finished
  retries: 360
  delay: 15
  changed_when: "'Image is up to date' not in (vllm_pull.stdout | default(''))"
  notify: recreate vllm container
  when: vllm_pull_job.ansible_job_id is defined

- name: Write the engine proxy location for this instance
  ansible.builtin.template:
    src: engine-location.conf.j2
    dest: "{{ engine_proxy_engines_dir }}/{{ vllm_instance }}.conf"
    # 0600: for a custom image this file carries the engine's key.
    mode: "0600"
  notify:
    - check engine proxy config
    - reload engine proxy

- name: Write the engine config and bring the container up
  ansible.builtin.import_tasks: config.yml
