---
# Push the fleet wildcard onto one standalone Inference Server and reload nginx (grove.tls).
# extra-vars: fleet_tls_cert, fleet_tls_key.
- name: Install the fleet certificate on a standalone Inference Server
  hosts: all
  become: true
  gather_facts: false

  roles:
    - fleet_tls

  tasks:
    - name: Check the engine proxy config
      ansible.builtin.command: /usr/local/openresty/bin/openresty -t
      changed_when: false

    - name: Reload the engine proxy
      ansible.builtin.systemd:
        name: openresty
        state: reloaded
