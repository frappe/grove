---
# One-time host bootstrap for an Inference Server: driver, data volume, exporters, engine proxy
# (inference_server.setup). extra-vars: gpu_data_mount, gpu_instance_store_hf_cache,
# monitoring_has_gpu, gpu_reboot_timeout, scrape_password_hash, the fleet TLS pair.
# grove_https before engine_proxy: a `listen 443 ssl` block with no certificate on disk stops nginx.
- name: Provision a GPU inference host
  hosts: all
  become: true
  gather_facts: true
  vars:
    monitoring_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
  roles:
    - remove_cloud_user
    - auditd
    - gpu_host
    - node_exporter
    - role: dcgm_exporter
      when: monitoring_has_gpu | bool
    - openresty
    - fleet_tls
    - grove_https
    - engine_proxy
