---
# Tear down one vLLM instance: container, run script, env file, key, proxy location; the shared
# caches and the image stay (model_replica.teardown_deployment). extra-vars: vllm_instance, vllm_home.
- name: Tear down a vLLM instance
  hosts: all
  become: true
  gather_facts: false
  vars:
    # Restated from engine_proxy's defaults: pulling the role in would install nginx during a teardown.
    engine_proxy_engines_dir: /etc/grove/nginx/engines
  tasks:
    - name: Remove the instance container
      ansible.builtin.command: "docker rm -f vllm-{{ vllm_instance }}"
      changed_when: true
      failed_when: false

    - name: Remove the instance container run script + env file
      ansible.builtin.file:
        path: "{{ vllm_home }}/containers/vllm-{{ vllm_instance }}.{{ item }}"
        state: absent
      loop:
        - sh
        - env

    - name: Remove the per-instance key file
      ansible.builtin.file:
        path: "{{ vllm_home }}/keys/{{ vllm_instance }}.key"
        state: absent

    - name: Remove the instance's engine proxy location
      ansible.builtin.file:
        path: "{{ engine_proxy_engines_dir }}/{{ vllm_instance }}.conf"
        state: absent
      register: engine_proxy_location

    - name: Reload the engine proxy without this instance
      when: engine_proxy_location.changed
      block:
        - name: Check the engine proxy config
          ansible.builtin.command: /usr/local/openresty/bin/openresty -t
          changed_when: false

        - name: Reload the engine proxy
          ansible.builtin.systemd:
            name: openresty
            state: reloaded
