---
# Update Engine Config: re-render one instance's env file and run script, replace the container
# if either moved (model_replica.reconfigure_deployment). extra-vars: the same as serve.yml.
- name: Apply an engine's config on a GPU inference host
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Re-render this instance's config and restart it
      ansible.builtin.import_role:
        name: vllm
        tasks_from: config.yml
